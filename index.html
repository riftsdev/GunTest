<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GunTest FPS</title><style>body{margin:0;overflow:hidden;background:#101820;color:white;font:14px Arial}#menu{position:fixed;inset:0;background:#07111cdd;display:grid;place-items:center}#panel{background:#1b3040;padding:25px;border-radius:14px;width:min(90vw,460px)}button,input{margin:5px;padding:8px}button{background:#268bc6;color:white;border:0;border-radius:5px;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;left:50%;top:50%;font-size:30px;transform:translate(-50%,-50%)}#ammo{position:absolute;right:25px;bottom:25px;font-size:25px}#hits{position:absolute;left:25px;bottom:25px}.binding{display:flex;justify-content:space-between;align-items:center}</style><div id="hud"><div id="cross">+</div><div id="ammo">12 / 120</div><div id="hits">Acertos: 0</div></div><div id="menu"><div id="panel"><h1>🔫 GunTest FPS</h1><p>Campo de tiro 3D: WASD, mouse, pulo, corrida, recarga e alvos. Clique para iniciar com Mouse Lock. ESC abre o menu.</p><button id="start">▶ INICIAR / LOCK MOUSE</button><p>Sensibilidade <input id="sens" type="range" min=".0005" max=".008" step=".0005" value=".0025"></p><h3>Mapear teclado e mouse</h3><div id="binds"></div><p>Selecione uma ação e pressione uma tecla ou botão do mouse.</p></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0x99b7cc);scene.fog=new T.Fog(0x99b7cc,40,100);
const camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,150),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x455044,2));const sun=new T.DirectionalLight(0xffe3bc,2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);
const material=c=>new T.MeshStandardMaterial({color:c}),floor=material(0x71885b),wall=material(0x7c8a90),wood=material(0x97673d),steel=material(0x262d35),white=material(0xe2e0d6),red=material(0xa83131),obstacles=[],boxes=[],targets=[];
function cube(w,h,d,x,y,z,m,solid=true){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);if(solid)obstacles.push(o);return o}
cube(120,1,120,0,-.5,0,floor,false);cube(120,8,2,0,4,-60,wall);cube(120,8,2,0,4,60,wall);cube(2,8,120,-60,4,0,wall);cube(2,8,120,60,4,0,wall);
for(let i=-2;i<=2;i++){cube(2.5,1.5,1,i*11,.75,-17,wood);cube(2,2,1,i*11,1,-33,wall);for(const z of [-27,-45]){const g=new T.Group();const pole=new T.Mesh(new T.CylinderGeometry(.07,.07,2),steel);pole.position.y=1;g.add(pole);for(const [r,m] of [[.8,white],[.55,red],[.3,white],[.12,red]]){const disc=new T.Mesh(new T.CylinderGeometry(r,r,.04,24),m);disc.rotation.x=Math.PI/2;disc.position.set(0,2.15,.8-r);g.add(disc)}g.position.set(i*11,0,z);scene.add(g);targets.push({g,hp:3,alive:true})}}
for(let i=0;i<12;i++){const b=cube(1.5,1.5,1.5,(i%6-2.5)*3,.75,8+Math.floor(i/6)*3,wood,false);b.userData.v=new T.Vector3();boxes.push(b)}
scene.add(camera);const gun=new T.Group();camera.add(gun);function gunpart(w,h,d,x,y,z,m){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);gun.add(o);return o}gunpart(.18,.16,.7,.3,-.27,-.65,steel);gunpart(.15,.3,.18,.3,-.48,-.38,wood);gunpart(.1,.09,.4,.3,-.19,-.82,steel);const flash=new T.PointLight(0xffb444,0,5);flash.position.set(.3,-.25,-1.1);gun.add(flash);
const defaults={forward:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',run:'ShiftLeft',fire:'Mouse0',reload:'KeyR',menu:'Escape'},binds={...defaults,...JSON.parse(localStorage.getItem('gt_keys')||'{}')};let waiting='',paused=true,started=false,sens=+(localStorage.getItem('gt_sens')||.0025);$('sens').value=sens;$('sens').oninput=e=>{sens=+e.target.value;localStorage.setItem('gt_sens',sens)};
function draw(){ $('binds').innerHTML='';for(const a of Object.keys(binds)){const d=document.createElement('div');d.className='binding';const s=document.createElement('span');s.textContent=a;const b=document.createElement('button');b.textContent=waiting===a?'Pressione...':binds[a];b.onclick=()=>{waiting=a;draw()};d.append(s,b);$('binds').append(d)}}draw();
let yaw=0,pitch=0,ammo=12,reserve=120,hits=0,vy=0,ground=true,reloading=false,lastShot=0,recoil=0;const keys=new Set(),pos=new T.Vector3(0,1.75,19),ray=new T.Raycaster();
function toggle(show){paused=show;$('menu').style.display=show?'grid':'none';if(show&&document.pointerLockElement)document.exitPointerLock();else if(!show)renderer.domElement.requestPointerLock?.()}$('start').onclick=()=>{started=true;toggle(false)};document.addEventListener('pointerlockchange',()=>{if(started&&!document.pointerLockElement)toggle(true)});
const action=c=>Object.keys(binds).find(a=>binds[a]===c);document.addEventListener('keydown',e=>{if(waiting){e.preventDefault();binds[waiting]=e.code;waiting='';localStorage.setItem('gt_keys',JSON.stringify(binds));draw();return}keys.add(e.code);const a=action(e.code);if(a==='menu')toggle(!paused);if(paused)return;if(a==='jump'&&ground){vy=7.5;ground=false}if(a==='reload')reload()});document.addEventListener('keyup',e=>keys.delete(e.code));let firing=false;document.addEventListener('mousedown',e=>{const code='Mouse'+e.button;if(waiting){binds[waiting]=code;waiting='';localStorage.setItem('gt_keys',JSON.stringify(binds));draw();return}if(action(code)==='fire'){firing=true;fire()}});document.addEventListener('mouseup',()=>firing=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement&&!paused){yaw-=e.movementX*sens;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*sens))}});
function reload(){if(reloading||ammo===12||!reserve)return;reloading=true;$('ammo').textContent='RECARREGANDO';setTimeout(()=>{const n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;hud()},1100)}function hud(){$('ammo').textContent=ammo+' / '+reserve;$('hits').textContent='Acertos: '+hits}
function fire(){if(paused||reloading||performance.now()-lastShot<190)return;if(!ammo){reload();return}lastShot=performance.now();ammo--;recoil=.1;flash.intensity=8;ray.setFromCamera(new T.Vector2(),camera);const objects=[...targets.filter(t=>t.alive).flatMap(t=>t.g.children),...boxes,...obstacles];const found=ray.intersectObjects(objects)[0];if(found){const t=targets.find(t=>t.alive&&t.g.children.includes(found.object));if(t){hits++;t.hp--;if(t.hp<=0){t.alive=false;t.g.rotation.z=1;setTimeout(()=>{t.hp=3;t.alive=true;t.g.rotation.z=0},4000)}}else if(boxes.includes(found.object))found.object.userData.v.add(ray.ray.direction.clone().multiplyScalar(8))}hud()}
function blocked(x,z){if(Math.abs(x)>58||Math.abs(z)>58)return true;for(const o of obstacles){if(o.position.y>3)continue;const b=new T.Box3().setFromObject(o);if(x>b.min.x-.35&&x<b.max.x+.35&&z>b.min.z-.35&&z<b.max.z+.35)return true}return false}
let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.05);prev=now;if(!paused){const f=+keys.has(binds.forward)-+keys.has(binds.back),s=+keys.has(binds.right)-+keys.has(binds.left),len=Math.hypot(f,s)||1,spd=keys.has(binds.run)?8:5,dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)/len*spd*dt,dz=(-Math.cos(yaw)*f+Math.sin(yaw)*s)/len*spd*dt;if(!blocked(pos.x+dx,pos.z))pos.x+=dx;if(!blocked(pos.x,pos.z+dz))pos.z+=dz;vy-=19*dt;pos.y+=vy*dt;if(pos.y<1.75){pos.y=1.75;vy=0;ground=true}camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);if(firing)fire();recoil=Math.max(0,recoil-dt*.8);gun.position.z=recoil;gun.rotation.x=recoil;flash.intensity=Math.max(0,flash.intensity-90*dt);for(const b of boxes){const v=b.userData.v;v.y-=13*dt;b.position.addScaledVector(v,dt);v.x*=Math.exp(-3*dt);v.z*=Math.exp(-3*dt);if(b.position.y<.75){b.position.y=.75;v.y=Math.abs(v.y)>.7?-v.y*.2:0}}}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
